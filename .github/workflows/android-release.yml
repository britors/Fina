name: Android Release

on:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  release:
    name: Signed .aab + .apk
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: apps/android

      # Caminho absoluto de propósito: signingConfigs.release.storeFile em
      # app/build.gradle.kts resolve `file(SIGNING_STORE_FILE)` relativo ao
      # diretório do módulo (apps/android/app/), não à raiz do checkout nem
      # ao working-directory deste step — um path relativo aqui já causou
      # "Keystore file ... not found" (o arquivo foi decodificado num nível
      # acima de onde o Gradle procurava).
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/apps/android/app/release.jks"

      - name: Build signed .aab and .apk
        working-directory: apps/android
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/apps/android/app/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --console=plain

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ github.workspace }}/apps/android/app/release.jks"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Não assumir /releases/latest: o atualizador desktop espera latest.yml.
          make_latest: false
          files: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
