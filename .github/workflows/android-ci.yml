name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test + assembleDebug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/android

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Android lint
        working-directory: apps/android
        run: ./gradlew lintDebug --console=plain

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-debug
          path: |
            apps/android/app/build/reports/lint-results-debug.html
            apps/android/app/build/reports/lint-results-debug.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --console=plain
