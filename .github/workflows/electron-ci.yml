name: Electron CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/electron/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/electron-ci.yml'
  pull_request:
    paths:
      - 'apps/electron/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/electron-ci.yml'

permissions:
  contents: read

jobs:
  test-typecheck-build:
    name: Test + typecheck + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
